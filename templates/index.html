<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akaryakıt Cepte - Canlı Fiyatlar & Rota</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root { 
    --primary: #0284c7; 
    --primary-dark: #0369a1;
    --bg: #f1f5f9; 
    --card-bg: #ffffff; 
    --text-main: #0f172a; 
    --text-muted: #64748b; 
    --success: #15803d; 
    --success-bg: #f0fdf4; 
    --border: #e2e8f0; 
    --fav-gold: #f59e0b; 
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{background:var(--bg);color:var(--text-main);padding-bottom:50px;}

header { 
    background: linear-gradient(135deg, #090d16, #1e293b); 
    color: white; 
    padding: 20px 16px 22px 16px; 
    border-bottom-left-radius: 24px; 
    border-bottom-right-radius: 24px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.18); 
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
.logo-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
.selectors { display: flex; gap: 8px; }
.city-select, .district-select { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 7px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; outline: none; backdrop-filter: blur(5px); cursor: pointer; }
.city-select option, .district-select option { color: #000; background: #fff; }

.badge-epdk { display: flex; justify-content: space-between; align-items: center; background: rgba(2, 132, 199, 0.22); color: #38bdf8; font-size: 11px; font-weight: 700; padding: 7px 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(56, 189, 248, 0.35); }
.gps-btn { background: #0284c7; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700; }
.status-bar { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; font-weight: 500; }

.container { padding: 16px; max-width: 620px; margin: 0 auto; }
.calc-card { background: #ffffff; border-radius: 20px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
.calc-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 6px; }

.route-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; position: relative; }
.route-field { position: relative; }
.route-field label { font-size: 11px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 3px; }
.route-field input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; background: #f8fafc; }
.route-field input:focus { border-color: var(--primary); background: #fff; }

.suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 10px; max-height: 160px; overflow-y: auto; z-index: 1000; box-shadow: 0 6px 15px rgba(0,0,0,0.1); display: none; }
.suggestion-item { padding: 9px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
.suggestion-item:hover { background: #f0fdf4; color: #15803d; }

.route-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.route-btn { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(2,132,199,0.25); text-align: center; }
.station-btn { background: linear-gradient(135deg, #0d9488, #0f766e); color: white; border: none; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(13,148,136,0.25); text-align: center; }
.clear-route-btn { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(239,68,68,0.25); text-align: center; }
.toggle-station-btn { background: linear-gradient(135deg, #64748b, #475569); color: white; border: none; padding: 10px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(100,116,139,0.25); text-align: center; }

.brand-filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none; }
.brand-filter-bar::-webkit-scrollbar { display: none; }
.filter-chip { background: #e2e8f0; color: #334155; border: none; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.filter-chip.active { background: #0f766e; color: white; box-shadow: 0 2px 6px rgba(15,118,110,0.3); }

#map { height: 280px; width: 100%; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 8px; z-index: 1; }
.map-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 5px; font-weight: 500; }

.calc-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.calc-field label { font-size: 11px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 3px; }
.calc-field input { width: 100%; padding: 7px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; background: #f8fafc; font-weight: 700; }

.company-card { background: var(--card-bg); border-radius: 18px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); border: 1px solid var(--border); padding: 14px 16px; }
.company-card.is-favorite { border: 2px solid var(--fav-gold); background: #fffdf8; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.company-brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; background: #fff; padding: 4px; border: 1px solid var(--border); }
.company-title { font-weight: 800; font-size: 16px; }
.fav-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #cbd5e1; }
.fav-btn.active { color: var(--fav-gold); }

.prices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f8fafc; padding: 10px; border-radius: 14px; border: 1px solid #f1f5f9; }
.price-box { text-align: center; padding: 8px 4px; border-radius: 10px; background: #ffffff; border: 1px solid #e2e8f0; }
.fuel-type { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
.fuel-price { font-size: 14px; font-weight: 800; color: var(--text-main); }
.trip-cost { font-size: 10px; font-weight: 700; color: #0284c7; margin-top: 4px; display: none; background: #e0f2fe; padding: 2px 4px; border-radius: 6px; }
.price-box.best-price { background: var(--success-bg); border: 1px solid #bbf7d0; }
.price-box.best-price .fuel-type { color: var(--success); font-weight: 800; }
.price-box.best-price .fuel-price { color: var(--success); font-weight: 900; }

.btn-refresh { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 6px 18px rgba(2,132,199,0.3); }
</style>
</head>
<body>
<header>
    <div class="top-bar">
        <div class="logo-title">⛽ Akaryakıt Cepte</div>
        <div class="selectors">
            <select id="il-select" class="city-select" onchange="ilDegisti()">
                <option value="adana">Adana</option><option value="ankara">Ankara</option><option value="antalya">Antalya</option><option value="bursa">Bursa</option><option value="elazig" selected>Elazığ</option><option value="istanbul">İstanbul</option><option value="izmir">İzmir</option><option value="konya">Konya</option><option value="trabzon">Trabzon</option>
            </select>
            <select id="ilce-select" class="district-select" onchange="ilceSecildi()">
                <option value="Merkez">Merkez</option>
            </select>
        </div>
    </div>
    <div class="badge-epdk">
        <span>🛡️ OSM Haritası & Uydu Modu Aktif</span>
        <button class="gps-btn" onclick="konumumuBul()">📍 Konumumu Kullan</button>
    </div>
    <div class="status-bar">
        <span id="data-source">Kaynak: Yükleniyor...</span>
        <span id="update-time">--:--</span>
    </div>
</header>
<div class="container">
    <div class="calc-card">
        <div class="calc-title">🚗 Karayolu Rota ve Yakıt Hesaplayıcı</div>
        <div class="route-inputs">
            <div class="route-field">
                <label>Nereden (Başlangıç)</label>
                <input type="text" id="baslangic-input" value="Elazığ" placeholder="Adres..." oninput="kullaniciYazdi('baslangic-input', 'baslangic-suggestions')">
                <div id="baslangic-suggestions" class="suggestions-box"></div>
            </div>
            <div class="route-field">
                <label>Nereye (Varış)</label>
                <input type="text" id="varis-input" value="Genç, Bingöl" placeholder="Adres..." oninput="kullaniciYazdi('varis-input', 'varis-suggestions')">
                <div id="varis-suggestions" class="suggestions-box"></div>
            </div>
        </div>
        
        <div class="route-field" style="margin-bottom: 10px;">
            <label>İstasyon Arama Yarıçapı (KM)</label>
            <input type="number" id="station-radius-input" value="30" min="1" max="200" placeholder="Örn: 30 KM">
        </div>

        <div class="route-actions">
            <button class="route-btn" onclick="rotaBulYazarak()">🔍 Rota Hesapla</button>
            <button class="station-btn" onclick="enYakinBenzinlikleriBul()">⛽ İstasyonları Bul</button>
            <button class="clear-route-btn" onclick="rotayiTemizle()">🗑️ Rotayı Temizle</button>
            <button class="toggle-station-btn" id="toggle-station-btn" onclick="istasyonlariGosterGizle()">👁️ İstasyonları Gizle</button>
        </div>
        
        <div class="brand-filter-bar" id="brand-filter-bar">
            <button class="filter-chip active" onclick="filtreleMarka('Tümü')">Tümü</button>
            <button class="filter-chip" onclick="filtreleMarka('Opet')">Opet</button>
            <button class="filter-chip" onclick="filtreleMarka('Shell')">Shell</button>
            <button class="filter-chip" onclick="filtreleMarka('Petrol Ofisi')">Petrol Ofisi</button>
            <button class="filter-chip" onclick="filtreleMarka('Aytemiz')">Aytemiz</button>
            <button class="filter-chip" onclick="filtreleMarka('TotalEnergies')">Total</button>
        </div>

        <div id="map"></div>
        <div class="map-hint">Harita sağ üst köşesinden Uydu veya Sokak görünümüne geçebilirsiniz. İstasyon ikonlarına tıklayarak detaylı fiyatları görebilirsiniz.</div>
        <div class="calc-inputs" style="margin-top: 12px;">
            <div class="calc-field"><label>Mesafe (KM)</label><input type="number" id="mesafe-km" value="100" oninput="maliyetHesapla()"></div>
            <div class="calc-field"><label>100 KM Tüketim (Lt)</label><input type="number" id="tuketim-lt" value="7.0" oninput="maliyetHesapla()" step="0.1"></div>
        </div>
    </div>
    <div id="company-list"><div style="text-align:center; padding: 30px; color:#64748b; font-weight:600;">⏳ Veriler yükleniyor...</div></div>
    <button id="btn-refresh" class="btn-refresh" onclick="fiyatlariGetir()">🔄 Fiyatları Güncelle</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DOMAIN_MAP = {
    'petrol ofisi': 'petrolofisi.com.tr', 'shell': 'shell.com.tr', 'opet': 'opet.com.tr',
    'aytemiz': 'aytemiz.com.tr', 'totalenergies': 'totalenergies.com.tr', 'total': 'totalenergies.com.tr',
    'kadoil': 'kadoil.com.tr', 'lukoil': 'lukoil.com.tr', 'alpet': 'alpet.com.tr', 'aygaz': 'aygaz.com.tr',
    'türkiye petrolleri': 'tpetrol.com.tr', 'tp': 'tpetrol.com.tr'
};

const BRAND_COLORS = {
    'Opet': '#166534',
    'Shell': '#b45309',
    'Petrol Ofisi': '#b91c1c',
    'TotalEnergies': '#c2410c',
    'Aytemiz': '#1d4ed8',
    'Aygaz': '#0284c7',
    'Kadoil': '#6d28d9',
    'Türkiye Petrolleri': '#991b1b'
};

let favorites = JSON.parse(localStorage.getItem('fuel_favs') || '[]');
let customBrands = JSON.parse(localStorage.getItem('station_custom_brands') || '{}');
let globalMarkalar = [];
let globalStations = [];
let aktifFiltre = 'Tümü';
let map = null;
let markerStart = null;
let markerEnd = null;
let polyline = null;
let stationMarkers = [];
let userGpsLat = null;
let userGpsLon = null;
let isUsingGps = false;
let stationsVisible = true;

const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' });
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });

function getLogoUrl(firma) {
    const name = firma.toLowerCase().trim();
    for (let key in DOMAIN_MAP) { if (name.includes(key)) return `https://www.google.com/s2/favicons?domain=${DOMAIN_MAP[key]}&sz=128`; }
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(firma)}&background=0284c7&color=fff&bold=true`;
}

function getBrandColor(brandName) {
    for (let key in BRAND_COLORS) {
        if (brandName.toLowerCase().includes(key.toLowerCase())) return BRAND_COLORS[key];
    }
    return '#0f766e';
}

function toggleFavorite(firma) {
    favorites = favorites.includes(firma) ? favorites.filter(f => f !== firma) : [...favorites, firma];
    localStorage.setItem('fuel_favs', JSON.stringify(favorites));
    kartlariOlustur(globalMarkalar);
}

function kaydetIstasyonMarkasi(stationKey) {
    const selectEl = document.getElementById(`brand-select-${stationKey}`);
    if(selectEl) {
        customBrands[stationKey] = selectEl.value;
        localStorage.setItem('station_custom_brands', JSON.stringify(customBrands));
        alert("İstasyon markası başarıyla kaydedildi!");
        haritadaGoster(globalStations);
    }
}

function initMap() {
    if (map) return;
    map = L.map('map', {
        layers: [osmLayer]
    }).setView([38.6749, 39.2225], 13);
    
    const baseMaps = {
        "Sokak (Standart)": osmLayer,
        "Uydu (Esri)": satelliteLayer
    };
    L.control.layers(baseMaps).addTo(map);
}

function istasyonlariGosterGizle() {
    stationsVisible = !stationsVisible;
    const btn = document.getElementById('toggle-station-btn');
    if (stationsVisible) {
        btn.innerText = "👁️ İstasyonları Gizle";
        stationMarkers.forEach(m => map.addLayer(m));
    } else {
        btn.innerText = "👁️ İstasyonları Göster";
        stationMarkers.forEach(m => map.removeLayer(m));
    }
}

function rotayiTemizle() {
    if(markerStart) { map.removeLayer(markerStart); markerStart = null; }
    if(markerEnd) { map.removeLayer(markerEnd); markerEnd = null; }
    if(polyline) { map.removeLayer(polyline); polyline = null; }
    document.getElementById('baslangic-input').value = '';
    document.getElementById('varis-input').value = '';
    document.getElementById('mesafe-km').value = '100';
    maliyetHesapla();
}

function kullaniciYazdi(inputId, boxId) {
    if(inputId === 'baslangic-input') { isUsingGps = false; }
    autocompleteAra(inputId, boxId);
}

let timeoutId = null;
function autocompleteAra(inputId, boxId) {
    const q = document.getElementById(inputId).value;
    const box = document.getElementById(boxId);
    if(q.length < 2) { box.style.display = 'none'; return; }
    clearTimeout(timeoutId);
    timeoutId = setTimeout(async () => {
        try {
            const res = await fetch(`/api/autocomplete?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if(data && data.length > 0) {
                let html = '';
                data.forEach(item => {
                    html += `<div class="suggestion-item" onclick="secimYap('${inputId}', '${boxId}', '${item.display_name.replace(/'/g, "")}')">${item.display_name}</div>`;
                });
                box.innerHTML = html;
                box.style.display = 'block';
            } else { box.style.display = 'none'; }
        } catch(e) { box.style.display = 'none'; }
    }, 300);
}

function secimYap(inputId, boxId, value) {
    if(inputId === 'baslangic-input') { isUsingGps = false; }
    document.getElementById(inputId).value = value;
    document.getElementById(boxId).style.display = 'none';
}

function konumumuBul() {
    if (!navigator.geolocation) { alert("Tarayıcınız konum desteklemiyor."); return; }
    const btn = document.querySelector('.gps-btn');
    btn.innerText = "Alınıyor...";
    navigator.geolocation.getCurrentPosition(async (position) => {
        userGpsLat = position.coords.latitude;
        userGpsLon = position.coords.longitude;
        isUsingGps = true;
        try {
            const res = await fetch(`/api/ters-kod?lat=${userGpsLat}&lon=${userGpsLon}`);
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('baslangic-input').value = data.display_name;
                const ilSelect = document.getElementById('il-select');
                for(let opt of ilSelect.options) { if(data.sehir.includes(opt.value)) { ilSelect.value = opt.value; break; } }
                ilDegisti();
            } else {
                document.getElementById('baslangic-input').value = `Mevcut Konum (${userGpsLat.toFixed(4)}, ${userGpsLon.toFixed(4)})`;
            }
        } catch(e) {
            document.getElementById('baslangic-input').value = `Mevcut Konum (${userGpsLat.toFixed(4)}, ${userGpsLon.toFixed(4)})`;
        } finally {
            if(!map) initMap();
            map.setView([userGpsLat, userGpsLon], 14);
            if(markerStart) map.removeLayer(markerStart);
            markerStart = L.marker([userGpsLat, userGpsLon]).addTo(map).bindPopup("Konumunuz (GPS)").openPopup();
            btn.innerText = "📍 Konumumu Kullan";
            enYakinBenzinlikleriBul();
        }
    }, () => {
        alert("Konum alınamadı.");
        btn.innerText = "📍 Konumumu Kullan";
    }, {timeout: 8000});
}

async function koordinatBul(yerAdi) {
    try {
        const res = await fetch(`/api/koordinat?yer=${encodeURIComponent(yerAdi)}`);
        const data = await res.json();
        if (data && data.status === 'success') { return [data.lat, data.lon]; }
    } catch(e) {}
    return null;
}

function ilceSecildi() {
    const ilce = document.getElementById('ilce-select').value;
    const il = document.getElementById('il-select').value;
    if(ilce && ilce !== 'Merkez') {
        document.getElementById('baslangic-input').value = `${ilce}, ${il}`;
        isUsingGps = false;
    }
}

async function enYakinBenzinlikleriBul() {
    let centerCoords = null;
    if (isUsingGps && userGpsLat && userGpsLon) {
        centerCoords = [userGpsLat, userGpsLon];
    } else if (markerStart) {
        let latLng = markerStart.getLatLng();
        centerCoords = [latLng.lat, latLng.lng];
    } else {
        centerCoords = await koordinatBul(document.getElementById('baslangic-input').value);
    }
    if (!centerCoords) { centerCoords = [38.6749, 39.2225]; }

    const radiusVal = parseFloat(document.getElementById('station-radius-input').value) || 30;
    const btn = document.querySelector('.station-btn');
    btn.innerText = "⏳ Aranıyor...";

    try {
        const res = await fetch(`/api/benzinlikler?lat=${centerCoords[0]}&lon=${centerCoords[1]}&radius=${radiusVal}`);
        const data = await res.json();
        if(data.status === 'success') {
            if(data.stations && data.stations.length > 0) {
                globalStations = data.stations;
                haritadaGoster(globalStations);
            }
            map.setView(centerCoords, radiusVal > 50 ? 10 : (radiusVal > 20 ? 11 : 13));
        }
    } catch(e) {
    } finally {
        btn.innerText = "⛽ İstasyonları Bul";
    }
}

function haritadaGoster(stations) {
    if(!map) initMap();
    stationMarkers.forEach(m => map.removeLayer(m));
    stationMarkers = [];

    stations.forEach(st => {
        const stationKey = `${st.lat.toFixed(4)}_${st.lon.toFixed(4)}`;
        const effectiveBrand = customBrands[stationKey] || st.brand;

        if (aktifFiltre !== 'Tümü' && !effectiveBrand.toLowerCase().includes(aktifFiltre.toLowerCase())) {
            return;
        }

        const bColor = getBrandColor(effectiveBrand);
        
        let popupContent = `
        <div style="font-family:'Plus Jakarta Sans',sans-serif; width: 240px; font-size: 11px;">
            <div style="background:${bColor}; color:white; padding:6px 8px; border-radius:6px 6px 0 0; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 180px;">⛽ ${st.name}</span>
            </div>
            <div style="padding:6px; background:#f8fafc; border:1px solid #e2e8f0; border-top:none; border-radius:0 0 6px 6px;">
                <div style="margin-bottom:6px; display:flex; gap:4px; align-items:center; background:#fff; padding:3px; border-radius:4px; border:1px solid #cbd5e1;">
                    <select id="brand-select-${stationKey}" style="flex:1; padding:2px 4px; border-radius:3px; border:1px solid #cbd5e1; font-size:10px; background:#fff; outline:none;">
                        <option value="Opet" ${effectiveBrand==='Opet'?'selected':''}>Opet</option>
                        <option value="Shell" ${effectiveBrand==='Shell'?'selected':''}>Shell</option>
                        <option value="Petrol Ofisi" ${effectiveBrand==='Petrol Ofisi'?'selected':''}>Petrol Ofisi</option>
                        <option value="Aytemiz" ${effectiveBrand==='Aytemiz'?'selected':''}>Aytemiz</option>
                        <option value="TotalEnergies" ${effectiveBrand==='TotalEnergies'?'selected':''}>TotalEnergies</option>
                        <option value="Kadoil" ${effectiveBrand==='Kadoil'?'selected':''}>Kadoil</option>
                        <option value="Türkiye Petrolleri" ${effectiveBrand==='Türkiye Petrolleri'?'selected':''}>Türkiye Petrolleri</option>
                    </select>
                    <button onclick="kaydetIstasyonMarkasi('${stationKey}')" style="background:#0284c7; color:white; border:none; padding:2px 6px; border-radius:3px; font-weight:bold; cursor:pointer; font-size:10px;">Seç</button>
                </div>
                <div style="max-height: 110px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 4px; background: #fff;">
                    <table style="width:100%; border-collapse:collapse; font-size:10px;">
                        <thead>
                            <tr style="background:#f1f5f9; color:#475569; text-align:left; position:sticky; top:0;">
                                <th style="padding:3px 4px; border-bottom:1px solid #e2e8f0;">Marka</th>
                                <th style="padding:3px 4px; border-bottom:1px solid #e2e8f0; text-align:right;">B</th>
                                <th style="padding:3px 4px; border-bottom:1px solid #e2e8f0; text-align:right;">M</th>
                                <th style="padding:3px 4px; border-bottom:1px solid #e2e8f0; text-align:right;">LPG</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
        if (globalMarkalar && globalMarkalar.length > 0) {
            globalMarkalar.forEach((m, idx) => {
                let isTargetBrand = m.firma.toLowerCase().includes(effectiveBrand.toLowerCase());
                let rowBg = isTargetBrand ? 'background: #fef08a; font-weight:bold;' : (idx % 2 === 0 ? 'background:#fafafa;' : 'background:#fff;');
                let bStr = m.benzin ? m.benzin.toFixed(2) + '₺' : '-';
                let mStr = m.motorin ? m.motorin.toFixed(2) + '₺' : '-';
                let lStr = m.lpg ? m.lpg.toFixed(2) + '₺' : '-';
                
                popupContent += `
                    <tr style="${rowBg} border-bottom:1px solid #f1f5f9;">
                        <td style="padding:3px 4px; color:${isTargetBrand ? bColor : '#0f172a'};">${isTargetBrand ? '★ ' : ''}${m.firma}</td>
                        <td style="padding:3px 4px; text-align:right; color:#0284c7;">${bStr}</td>
                        <td style="padding:3px 4px; text-align:right; color:#0284c7;">${mStr}</td>
                        <td style="padding:3px 4px; text-align:right; color:#0284c7;">${lStr}</td>
                    </tr>`;
            });
        }
        popupContent += `</tbody></table></div></div></div>`;

        const marker = L.marker([st.lat, st.lon], {
            icon: L.divIcon({
                className: 'custom-station-icon',
                html: `<div style="background:${bColor};color:white;padding:3px 6px;border-radius:5px;font-size:9px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4);">⛽ ${effectiveBrand}</div>`,
                iconSize: [80, 20]
            })
        });

        if (stationsVisible) {
            marker.addTo(map);
        }
        marker.bindPopup(popupContent);
        stationMarkers.push(marker);
    });
}

function filtreleMarka(marka) {
    aktifFiltre = marka;
    document.querySelectorAll('.filter-chip').forEach(btn => {
        if(btn.innerText.includes(marka) || (marka === 'Tümü' && btn.innerText === 'Tümü')) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    if(globalStations.length > 0) {
        haritadaGoster(globalStations);
    }
}

async function rotaBulYazarak() {
    const baslangicText = document.getElementById('baslangic-input').value;
    const varisText = document.getElementById('varis-input').value;
    if(!baslangicText || !varisText) { alert("Lütfen rotayı eksiksiz girin."); return; }

    const btn = document.querySelector('.route-btn');
    btn.innerText = "⏳ Hesaplanıyor...";
    btn.disabled = true;

    try {
        let startCoords = (isUsingGps && userGpsLat && userGpsLon) ? [userGpsLat, userGpsLon] : await koordinatBul(baslangicText);
        const endCoords = await koordinatBul(varisText);

        if(startCoords && endCoords) {
            if(!map) initMap();
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}?overview=full&geometries=geojson`;
            const res = await fetch(osrmUrl);
            const data = await res.json();

            if(markerStart) map.removeLayer(markerStart);
            if(markerEnd) map.removeLayer(markerEnd);
            if(polyline) map.removeLayer(polyline);

            markerStart = L.marker(startCoords).addTo(map).bindPopup(baslangicText);
            markerEnd = L.marker(endCoords).addTo(map).bindPopup(varisText);

            if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                const km = (data.routes[0].distance / 1000).toFixed(1);
                const latLngs = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                polyline = L.polyline(latLngs, {color: '#0284c7', weight: 5, opacity: 0.85}).addTo(map);
                map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
                document.getElementById('mesafe-km').value = km;
            } else {
                polyline = L.polyline([startCoords, endCoords], {color: '#0284c7', weight: 4}).addTo(map);
                map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
            }
            maliyetHesapla();
        } else {
            alert("Girilen konumlar haritada bulunamadı.");
        }
    } catch(e) {
        alert("Rota hesaplanamadı.");
    } finally {
        btn.innerText = "🔍 Rota Hesapla";
        btn.disabled = false;
    }
}

async function ilDegisti() {
    const il = document.getElementById('il-select').value;
    try {
        const res = await fetch(`/api/ilceler?il=${il}`);
        const data = await res.json();
        let html = '';
        if(data.status === 'success') {
            data.ilceler.forEach(ilce => { html += `<option value="${ilce}">${ilce}</option>`; });
        }
        document.getElementById('ilce-select').innerHTML = html || '<option value="Merkez">Merkez</option>';
    } catch(e) {}
    ilceSecildi();
    fiyatlariGetir();
}

async function fiyatlariGetir() {
    const il = document.getElementById('il-select').value;
    const btn = document.getElementById('btn-refresh');
    btn.disabled = true; btn.innerText = "⏳ Güncelleniyor...";
    try {
        const response = await fetch(`/api/fiyatlar?il=${il}`);
        const res = await response.json();
        if(res.status === 'success' && res.markalar && res.markalar.length > 0) {
            document.getElementById('update-time').innerText = res.tarih;
            document.getElementById('data-source').innerText = `Kaynak: ${res.source}`;
            globalMarkalar = res.markalar;
            kartlariOlustur(globalMarkalar);
            if(globalStations.length > 0) {
                haritadaGoster(globalStations);
            }
        }
    } catch (e) {} finally {
        btn.disabled = false; btn.innerText = "🔄 Fiyatları Güncelle";
    }
}

function kartlariOlustur(markalar) {
    if(!markalar || markalar.length === 0) return;
    const minB = Math.min(...markalar.map(m => m.benzin).filter(Boolean));
    const minM = Math.min(...markalar.map(m => m.motorin).filter(Boolean));
    const minL = Math.min(...markalar.map(m => m.lpg).filter(Boolean));
    
    markalar.sort((a, b) => (favorites.includes(b.firma) - favorites.includes(a.firma)) || a.firma.localeCompare(b.firma));
    let html = '';
    markalar.forEach(m => {
        const isFav = favorites.includes(m.firma);
        const logo = getLogoUrl(m.firma);
        const isBestB = m.benzin && Math.abs(m.benzin - minB) < 0.01;
        const isBestM = m.motorin && Math.abs(m.motorin - minM) < 0.01;
        const isBestL = m.lpg && Math.abs(m.lpg - minL) < 0.01;
        
        html += `
        <div class="company-card ${isFav ? 'is-favorite' : ''}" data-firma="${m.firma}" data-benzin="${m.benzin || 0}" data-motorin="${m.motorin || 0}" data-lpg="${m.lpg || 0}">
            <div class="card-header">
                <div class="company-brand">
                    <img src="${logo}" class="brand-logo" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.firma)}'">
                    <span class="company-title">${m.firma}</span>
                </div>
                <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${m.firma}')">${isFav ? '★' : '☆'}</button>
            </div>
            <div class="prices-grid">
                <div class="price-box ${isBestB ? 'best-price' : ''}">
                    <div class="fuel-type">${isBestB ? '⭐ Benzin' : 'Benzin'}</div>
                    <div class="fuel-price">${m.benzin ? m.benzin.toFixed(2) + ' ₺' : '-'}</div>
                    <div class="trip-cost b-cost"></div>
                </div>
                <div class="price-box ${isBestM ? 'best-price' : ''}">
                    <div class="fuel-type">${isBestM ? '⭐ Motorin' : 'Motorin'}</div>
                    <div class="fuel-price">${m.motorin ? m.motorin.toFixed(2) + ' ₺' : '-'}</div>
                    <div class="trip-cost m-cost"></div>
                </div>
                <div class="price-box ${isBestL ? 'best-price' : ''}">
                    <div class="fuel-type">${isBestL ? '⭐ LPG' : 'LPG'}</div>
                    <div class="fuel-price">${m.lpg ? m.lpg.toFixed(2) + ' ₺' : '-'}</div>
                    <div class="trip-cost l-cost"></div>
                </div>
            </div>
        </div>`;
    });
    document.getElementById('company-list').innerHTML = html;
    maliyetHesapla();
}

function maliyetHesapla() {
    const km = parseFloat(document.getElementById('mesafe-km').value) || 0;
    const tuketim = parseFloat(document.getElementById('tuketim-lt').value) || 0;
    const carpan = (km * tuketim) / 100.0;
    
    document.querySelectorAll('.company-card').forEach(card => {
        const b = parseFloat(card.dataset.benzin);
        const m = parseFloat(card.dataset.motorin);
        const l = parseFloat(card.dataset.lpg);
        
        const bCostElem = card.querySelector('.b-cost');
        const mCostElem = card.querySelector('.m-cost');
        const lCostElem = card.querySelector('.l-cost');
        
        if (carpan > 0) {
            if(b > 0) { bCostElem.innerText = `Yol: ${(b * carpan).toFixed(1)} ₺`; bCostElem.style.display = 'block'; } else { bCostElem.style.display = 'none'; }
            if(m > 0) { mCostElem.innerText = `Yol: ${(m * carpan).toFixed(1)} ₺`; mCostElem.style.display = 'block'; } else { mCostElem.style.display = 'none'; }
            if(l > 0) { lCostElem.innerText = `Yol: ${(l * carpan).toFixed(1)} ₺`; lCostElem.style.display = 'block'; } else { lCostElem.style.display = 'none'; }
        } else {
            bCostElem.style.display = 'none';
            mCostElem.style.display = 'none';
            lCostElem.style.display = 'none';
        }
    });
}

window.onload = async () => { 
    initMap(); 
    await ilDegisti(); 
    enYakinBenzinlikleriBul(); 
};
</script>
